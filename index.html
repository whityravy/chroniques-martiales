<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100e0b">
  <title>Chroniques Martiales — Générateur narratif de combat</title>
  <meta name="description" content="Générateur narratif de combat pour le maître du jeu.">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Icônes SVG intégrées : aucune bibliothèque externe à charger. */
    .icon-svg { width: 1em; height: 1em; display: inline-block; vertical-align: middle; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .brand-mark .icon-svg { width: 36px; height: 36px; }
    .tab-icon .icon-svg { width: 23px; height: 23px; }
    .action-icon .icon-svg { width: 29px; height: 29px; }
    .secondary-button { display: inline-flex; align-items: center; gap: 7px; }
    .secondary-button .icon-svg { width: 16px; height: 16px; }
  </style>
</head>
<body>
  <main class="app">
    <header class="site-header">
      <div class="brand-mark" aria-hidden="true"><svg class="icon-svg" viewBox="0 0 24 24"><path d="m14.5 17.5 3-3L21 11l-2-2-3.5 3.5-3 3M5 19l4-4m-2-2 4-4m-5 1 2-2 10 10-2 2zM3 21l3-3"/><path d="m14 5 5-2-2 5M4 4l4 4"/></svg></div>
      <h1>CHRONIQUES MARTIALES</h1>
      <p class="subtitle">GÉNÉRATEUR NARRATIF DE COMBAT</p>
      <p class="tagline">LES CHRONIQUES S'ÉCRIVENT DANS LE SANG</p>
    </header>

    <nav class="tabs" aria-label="Catégories principales">
      <button class="tab active" data-tab="combat"><span class="tab-icon"><svg class="icon-svg" viewBox="0 0 24 24"><path d="m14.5 17.5 3-3L21 11l-2-2-3.5 3.5-3 3M5 19l4-4m-2-2 4-4m-5 1 2-2 10 10-2 2zM3 21l3-3"/></svg></span><span>Combat</span></button>
      <button class="tab" data-tab="blessures"><span class="tab-icon"><svg class="icon-svg" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l3.4-3.4M15 8l-2 3 3 1-2 3"/></svg></span><span>Blessures</span></button>
      <button class="tab" data-tab="finisseurs"><span class="tab-icon"><svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 3a8 8 0 0 0-5 14.2V21h10v-3.8A8 8 0 0 0 12 3Z"/><path d="M9 10h.01M15 10h.01M9 15l3-2 3 2M9 21v-3m6 3v-3"/></svg></span><span>Finisseurs</span></button>
      <button class="tab" data-tab="creatures"><span class="tab-icon"><svg class="icon-svg" viewBox="0 0 24 24"><path d="M8 10a2 2 0 1 0 0-4 2 2 0 0 0 0 4Zm8 0a2 2 0 1 0 0-4 2 2 0 0 0 0 4ZM4 15a2 2 0 1 0 0-4 2 2 0 0 0 0 4Zm16 0a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/><path d="M12 13c-3 0-6 3-6 6 0 1.2 1 2 2.2 2 1 0 2-.7 3.8-.7s2.8.7 3.8.7c1.2 0 2.2-.8 2.2-2 0-3-3-6-6-6Z"/></svg></span><span>Créatures</span></button>
    </nav>

    <section id="actions" class="actions" aria-live="polite"></section>

    <section class="chronicle">
      <div class="section-heading"><span>CHRONIQUE DU COMBAT</span><span class="ornament" aria-hidden="true">✦</span></div>
      <p id="result" class="result" aria-live="polite">Les chroniques attendent que le premier sang soit versé…</p>
      <div class="result-actions">
        <button id="copy" class="secondary-button" type="button"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg> Copier</button>
        <span id="copy-status" class="copy-status" role="status"></span>
      </div>
    </section>

    <section class="history">
      <div class="history-heading"><h2>DERNIÈRES CHRONIQUES</h2><button id="clear-history" class="text-button" type="button">Effacer</button></div>
      <ol id="history-list" class="history-list"><li class="empty-history">Aucune action pour le moment.</li></ol>
    </section>
    <footer>UN OUTIL POUR LE MAÎTRE DU JEU</footer>
  </main>

  <script src="script.js"></script>
  <script>
    // Dessine les pictogrammes des actions avec des SVG intégrés à cette page.
    (function () {
      const paths = {
        sword: '<path d="m14 7 3-3 3 3-3 3M4 20l10-10M7 17l-3 3m2-7 5 5M14 4l6 6"/>',
        swords: '<path d="m4 4 16 16M7 3l-4 4 14 14 4-4M20 4 4 20M17 3l4 4L7 21l-4-4"/>',
        target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="m12 12 7-7m-3 0h3v3"/>',
        dodge: '<path d="M4 12h14m-5-5 5 5-5 5M4 5v14"/>',
        shield: '<path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11Z"/><path d="m9 12 2 2 4-4"/>',
        shieldBroken: '<path d="m12 22 1.5-.8C16 19.8 20 16 20 11V5l-6-2M8 4 4 5v6c0 3 1.4 5.6 3.2 7.5M12 22s-1.2-.6-2.7-1.7"/><path d="m9 8 6 8m0-8-6 8"/>',
        heart: '<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/>',
        heartCrack: '<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/><path d="m13 7-2 4 3 1-3 5"/>',
        pulse: '<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/><path d="M3 12h5l2-3 3 6 2-3h4"/>',
        skull: '<path d="M12 3a8 8 0 0 0-5 14.2V21h10v-3.8A8 8 0 0 0 12 3Z"/><path d="M9 10h.01M15 10h.01M9 15l3-2 3 2M9 21v-3m6 3v-3"/>',
        zap: '<path d="m13 2-3 9h7l-6 11 1-9H5l8-11Z"/>',
        wind: '<path d="M3 8h12a3 3 0 1 0-3-3M2 12h17a3 3 0 1 1-3 3M4 16h6a2 2 0 1 1-2 2"/>',
        eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',
        paw: '<path d="M8 10a2 2 0 1 0 0-4 2 2 0 0 0 0 4Zm8 0a2 2 0 1 0 0-4 2 2 0 0 0 0 4ZM4 15a2 2 0 1 0 0-4 2 2 0 0 0 0 4Zm16 0a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/><path d="M12 13c-3 0-6 3-6 6 0 1.2 1 2 2.2 2 1 0 2-.7 3.8-.7s2.8.7 3.8.7c1.2 0 2.2-.8 2.2-2 0-3-3-6-6-6Z"/>',
        cog: '<circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.7a8 8 0 0 1-1.7 1l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.7-1l-1.7.7-1.4-2.4 1.4-1.1a7 7 0 0 1 0-2l-1.4-1.1 1.4-2.4 1.7.7a8 8 0 0 1 1.7-1l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.7 1l1.7-.7 1.4 2.4-1.4 1.1a7 7 0 0 1 0 2Z"/>',
        flame: '<path d="M8 14c0-3 3-4 3-9 4 3 6 6 5 10a4 4 0 0 1-8 0Z"/><path d="M11 21c-4 0-6-3-5-6 1-2 2-2 3-4 0 3 2 3 2 5 1-1 2-2 2-4 3 3 3 9-2 9Z"/>',
        sprout: '<path d="M12 22v-9m0 2c-6 0-9-3-9-9 6 0 9 3 9 9Zm0-4c0-6 3-9 9-9 0 6-3 9-9 9Z"/>'
      };
      const names = {
        'Attaque réussie':'sword','Attaque critique':'swords','Attaque ratée':'target',
        'Esquive réussie':'dodge','Parade réussie':'shield','Défense ratée':'shieldBroken',
        'Blessure légère':'heart','Blessure sérieuse':'heartCrack','Blessure grave':'pulse','Blessure mortelle':'skull',
        'Adversaire terrassé':'swords','Coup fatal':'zap','Exécution':'skull','Dernier souffle':'wind',
        'Aberration':'eye','Bête':'paw','Artificiel':'cog','Dragon':'flame','Mort-vivant':'skull','Plante':'sprout'
      };
      function updateActionIcons() {
        document.querySelectorAll('.action-button').forEach(button => {
          const label = button.querySelector('.action-label');
          const slot = button.querySelector('.action-icon');
          if (!label || !slot) return;
          const name = names[label.textContent.trim()];
          if (!name || slot.dataset.svgIcon === name) return;
          slot.dataset.svgIcon = name;
          slot.innerHTML = '<svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">' + paths[name] + '</svg>';
        });
      }
      updateActionIcons();
      const actions = document.getElementById('actions');
      if (actions && window.MutationObserver) new MutationObserver(updateActionIcons).observe(actions, {childList:true,subtree:true});
    })();
  </script>
</body>
</html>
